name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm --filter @resumeflow/server exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter @resumeflow/server test
      - run: pnpm --filter @resumeflow/server exec tsx --tsconfig ../web/tsconfig.app.json --test "../web/test/*.test.ts"

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: resumeflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name resumeflow-ci -p 127.0.0.1:18080:3000 resumeflow:ci
          trap 'docker rm -fv resumeflow-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/health >/dev/null
          curl -fsS http://127.0.0.1:18080/ | grep -q '<div id="root"></div>'
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'http://127.0.0.1:18080';
          const created = await fetch(`${base}/api/resumes`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: 'CI', markdown: '# CI' }),
          });
          assert.equal(created.status, 201);
          const resume = await created.json();
          const response = await fetch(`${base}/mcp`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json, text/event-stream' },
            body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'tools/call',
              params: { name: 'export_resume_pdf', arguments: { id: resume.id } } }),
          });
          assert.equal(response.status, 200);
          const line = (await response.text()).split('\n').find(line => line.startsWith('data: '));
          assert.ok(line);
          const { result } = JSON.parse(line.slice(6));
          assert.ok(!result.isError);
          const { url } = JSON.parse(result.content[0].text);
          assert.equal(new URL(url).origin, base);
          const pdf = await fetch(url);
          assert.equal(pdf.status, 200);
          assert.equal(Buffer.from(await pdf.arrayBuffer()).subarray(0, 5).toString(), '%PDF-');
          JS

  publish:
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: boses
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: boses/resumeflow
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - name: Publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm --filter @resumeflow/server exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter @resumeflow/server test
      - run: pnpm --filter @resumeflow/server exec tsx --tsconfig ../web/tsconfig.app.json --test "../web/test/*.test.ts"

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: resumeflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name resumeflow-ci -p 127.0.0.1:3000:3000 resumeflow:ci
          trap 'docker rm -f resumeflow-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health >/dev/null
          curl -fsS http://127.0.0.1:3000/ | grep -q '<div id="root"></div>'
          id=$(curl -fsS -X POST http://127.0.0.1:3000/api/resumes \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI","markdown":"# CI"}' \
            | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).id")
          curl -fsS "http://127.0.0.1:3000/api/resumes/$id/pdf" -o /tmp/resumeflow-ci.pdf
          test "$(head -c 5 /tmp/resumeflow-ci.pdf)" = '%PDF-'

  publish:
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: boses
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: boses/resumeflow
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - name: Publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

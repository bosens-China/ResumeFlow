<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- 背景渐变：深邃石板黑 -> 幽蓝黑 -->
    <linearGradient id="rf-opt3-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D16"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>

    <!-- 字母 R 竖干渐变：清晨蓝 -> 沉稳蔚蓝 -->
    <linearGradient id="rf-opt3-stem" x1="8" y1="7" x2="8" y2="25" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <!-- 字母 R 流动环带与延伸腿：电光蓝 -> 极光青 -->
    <linearGradient id="rf-opt3-ribbon" x1="8" y1="8.5" x2="23" y2="25" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.45" stop-color="#3B82F6"/>
      <stop offset="0.85" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>

    <!-- 环弧高光 -->
    <linearGradient id="rf-opt3-glint" x1="12" y1="8.5" x2="22" y2="8.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- 图标底壳：极客黑微圆角，带微弱内边框 -->
  <rect width="32" height="32" rx="7.5" fill="url(#rf-opt3-bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" stroke="white" stroke-opacity="0.1" stroke-width="1"/>

  <!-- 字母 R 主竖干 (The Document Spine) -->
  <line x1="8" y1="7" x2="8" y2="25" stroke="url(#rf-opt3-stem)" stroke-width="3" stroke-linecap="round"/>

  <!-- 字母 R 上环弧 (Upper Bowl / Loop) -->
  <path d="M 8 8.5 H 15 C 19 8.5, 22 10.8, 22 13.8 C 22 16.8, 19 18.5, 15 18.5 H 8.5" stroke="url(#rf-opt3-ribbon)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 环内排版微线 (Resume text bar inside R) -->
  <line x1="11" y1="13.5" x2="16.5" y2="13.5" stroke="#BAE6FD" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 字母 R 下延流动腿 (The Flow Leg) -->
  <path d="M 13.5 17.5 C 15.5 19, 17.5 21.5, 22 25" stroke="url(#rf-opt3-ribbon)" stroke-width="3" stroke-linecap="round"/>

  <!-- 尾部灵动光点 (AI Prompt / Flow Terminal) -->
  <circle cx="22" cy="25" r="1.3" fill="#67E8F9"/>
</svg>
